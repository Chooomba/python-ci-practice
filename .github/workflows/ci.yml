name: Python CI

on:
  push:
    branches:
      - main
      - 'docs/**'
    tags:
      - '*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    container:
      image: python:3.11.10-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python and commit
        run: |
          python --version
          echo "Commit: $GITHUB_SHA"

      - name: Check required files
        run: |
          test -f README.md || { echo "README.md is missing"; exit 1; }
          test -s app.py || { echo "app.py is missing or empty"; exit 1; }

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Check deployment settings without printing secrets
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          test -n "$DEPLOY_TOKEN" || { echo "DEPLOY_TOKEN is not configured"; exit 1; }
          test "$APP_PORT" = "8102" || { echo "APP_PORT must be 8102"; exit 1; }
          echo "Required deployment settings are configured."

  test:
    name: test
    runs-on: ubuntu-latest
    needs: validate
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    container:
      image: python:3.11.10-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    name: package
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare dist and manifest
        run: |
          mkdir -p dist
          cp books.py README.md Dockerfile books.json.example dist/
          {
            echo "CI_COMMIT_SHA=$GITHUB_SHA"
            echo "CI_PIPELINE_ID=$GITHUB_RUN_ID"
            echo "FILES:"
            printf '%s\\n' books.py README.md Dockerfile books.json.example
          } > dist/manifest.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: books-project
          path: dist/
          retention-days: 7

  deploy_test:
    name: deploy_test
    runs-on: ubuntu-latest
    needs: [validate, test, package]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: test
    steps:
      - name: Check protected deployment token
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          test -n "$DEPLOY_TOKEN" || { echo "DEPLOY_TOKEN is not configured"; exit 1; }
          test "$APP_PORT" = "8102" || { echo "APP_PORT must be 8102"; exit 1; }
          echo "Deployment settings are present. Token value is hidden."
